:root {
  --ink: #292634;
  --secondary: #575263;
  --muted: #736d7e;
  --line: #e8e2ec;
  --paper: #fbf8fb;
  --card: rgba(255, 255, 255, 0.84);
  --purple: #7458ab;
  --deep: #624994;
  --lilac: #eee7f8;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font: 15px/1.48 var(--sans);
  letter-spacing: -0.014em;
  color: var(--ink);
  background: #fbf8fb;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
html {
  min-height: 100%;
}
body {
  margin: 0;
  min-width: 320px;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 2% 15%, #f1ebfc99, transparent 46%),
    radial-gradient(ellipse at 96% 20%, #fde6e8a0, transparent 46%),
    linear-gradient(130deg, #fcfafb, #fffbf8 57%, #f7f2fa);
  min-height: 100vh;
}
/* Both silk folds stay behind the journal and move independently of scrolling. */
.silk-stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
  pointer-events: none;
}
.silk-stage i {
  position: absolute;
  inset: -18%;
  mask-image: linear-gradient(90deg, transparent, black 9%, black 91%, transparent);
}
.silk-lavender {
  background:
    radial-gradient(
      ellipse 77% 69% at -20% 0%,
      transparent 58%,
      #bfa9e00d 72%,
      #a78aca61 83%,
      #fdfaff80 85%,
      #bda6dc3c 87%,
      transparent 95%
    ),
    radial-gradient(
      ellipse 66% 54% at -16% -1%,
      transparent 61%,
      #d2c0e816 79%,
      #bfa5db2b 91%,
      transparent 98%
    );
  transform: rotate(-9deg);
  transform-origin: 18% 34%;
}
.silk-blush {
  background:
    radial-gradient(
      ellipse 80% 65% at 115% 87%,
      transparent 61%,
      #eed1de16 73%,
      #d29bb95e 84%,
      #fffafa88 86%,
      #ddbbcf42 90%,
      transparent 98%
    ),
    radial-gradient(
      ellipse 67% 57% at 116% 94%,
      transparent 62%,
      #ddc6e31c 78%,
      #d9bfd632 87%,
      transparent 99%
    );
  transform: rotate(-14deg);
  transform-origin: 84% 64%;
}
@keyframes silk-lavender {
  0%, 100% { transform: translate3d(-6%, -4%, 0) rotate(-12deg) skewY(-3deg); }
  32% { transform: translate3d(4%, 5%, 0) rotate(0deg) scale(1.06, 1.12); }
  68% { transform: translate3d(7%, -2%, 0) rotate(-7deg) skewY(4deg); }
}
@keyframes silk-blush {
  0%, 100% { transform: translate3d(6%, 3%, 0) rotate(-13deg); }
  38% { transform: translate3d(-6%, -6%, 0) rotate(-2deg) skewY(3deg); }
  72% { transform: translate3d(-2%, 6%, 0) rotate(-16deg) scale(1.08, 1.03); }
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
}
button:disabled {
  opacity: 0.62;
  cursor: wait;
}
a {
  color: var(--purple);
  text-decoration: none;
}
a:hover,
.textlink:hover {
  text-decoration: underline;
  text-underline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #9679cf;
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  letter-spacing: -0.047em;
}
h1 {
  font-size: clamp(36px, 3.7vw, 54px);
  font-weight: 610;
  line-height: 1.08;
}
h2 {
  font-size: 23px;
  font-weight: 610;
  line-height: 1.18;
}
h3 {
  font-size: 15px;
  line-height: 1.3;
  font-weight: 620;
}
small {
  color: var(--muted);
}
.icon {
  display: inline-block;
  vertical-align: middle;
  flex: none;
}
.topbar {
  background: #fffbffb3;
  border-bottom: 1px solid #eae3ee;
}
.barinner,
.mainwrap,
.footer {
  width: min(1160px, calc(100% - 96px));
  margin-inline: auto;
}
.barinner {
  display: flex;
  align-items: center;
  gap: 25px;
  height: 74px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--purple);
  font-size: 25px;
  letter-spacing: -0.065em;
  font-weight: 710;
}
.brand:hover {
  text-decoration: none;
}
.brandmark {
  display: inline-block;
  width: 32px;
  height: 32px;
  flex: none;

}
.barinner nav {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: auto;
}
.barinner nav a {
  color: #605b6d;
  display: flex;
  align-items: center;
  gap: 7px;
  border-radius: 16px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 530;
}
.barinner nav a:hover {
  background: #f4eef8;
  text-decoration: none;
}
.barinner nav a[aria-current] {
  color: var(--deep);
  background: #eee6f8;
}
.barinner nav .nav-settings {
  display: none;
}
.account {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #f3eaf5;
  border: 1px solid #e9ddea;
  color: #795587;
  font-size: 12px;
  font-weight: 650;
}
.avatar:hover {
  text-decoration: none;
  background: #ebdef1;
}
.square,
.rowgo {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: #746c81;
}
.account .square {
  border: 1px solid var(--line);
  background: #fff9;
}
.square:hover,
.rowgo:hover,
.square.active {
  color: #614496;
  background: #f0eaf8;
}
.demolabel {
  font-size: 10px;
  color: #7d638b;
  border: 1px solid #e4d7ec;
  background: #f8eff966;
  padding: 3px 8px;
  border-radius: 20px;
}
.mainwrap {
  padding: 33px 0 34px;
  min-height: calc(100vh - 145px);
}
.pagehead,
.sectionhead,
.navline,
.settingrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.pagehead {
  margin-bottom: 23px;
}
.pagehead > div > p {
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
}
.greeting,
.kicker {
  font-size: 13px;
  color: var(--secondary);
  font-weight: 490;
  margin-bottom: 5px;
}
.kicker i {
  display: none;
}
.metadot {
  padding: 0 4px;
  color: #a49bab;
}
.headactions,
.choicegrid,
.photochoices {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn,
.textlink,
.dangertext,
.bodyvalue {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.btn {
  min-height: 39px;
  border-radius: 13px;
  padding: 9px 16px;
  font-weight: 580;
  font-size: 12px;
  line-height: 1.32;
  white-space: nowrap;
  border: 1px solid transparent;
}
.btn:hover {
  text-decoration: none;
  filter: brightness(0.975);
}
.primary {
  background: linear-gradient(105deg, #9b86db, #b699e0 56%, #cfb1e3);
  color: #332545;
  box-shadow: 0 3px 9px #a58bcd22;
}
.outline {
  background: #fffc;
  color: var(--deep);
  border-color: #dfd4ee;
}
.mini {
  padding: 5px 11px;
  min-height: 30px;
  font-size: 11px;
}
.attended {
  background: #ede7f7;
  color: #6b519a;
}
.wide {
  width: 100%;
  margin-top: 9px;
}
.textlink {
  color: var(--purple);
  font-size: 12px;
  font-weight: 580;
  padding: 2px 0;
  line-height: 1.4;
}
.weatherpill {
  border: 1px solid #eee2e7;
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  padding: 9px 14px;
  border-radius: 16px;
  background: #fff9;
  color: #9d7d99;
}
.weatherpill span {
  display: grid;
}
.weatherpill b {
  color: var(--secondary);
  font-size: 12px;
  font-weight: 580;
}
.weatherpill small {
  font-size: 10px;
}
.dashboard {
  display: grid;
  grid-template-columns: 1.06fr 1fr;
  gap: 22px;
  align-items: start;
}
.balancecolumn,
.progresscolumn,
.stack,
.daylist {
  display: grid;
  gap: 16px;
  min-width: 0;
}
.panel {
  background: var(--card);
  border: 1px solid #eae3ed;
  border-radius: 22px;
  padding: 23px;
  box-shadow: 0 7px 22px #74608106;
  min-width: 0;
}
.sectionhead {
  margin-bottom: 15px;
}
.sectionhead h2 {
  font-size: 21px;
}
.balancecard {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(127deg, #fffafc, #fff6f4 72%, #f5edf9);
  padding: 27px 28px 20px;
}

@media (prefers-reduced-motion: no-preference) {
  html:not([data-motion="off"]) .silk-lavender {
    animation: silk-lavender 14s ease-in-out -2s infinite;
  }
  html:not([data-motion="off"]) .silk-blush {
    animation: silk-blush 17s ease-in-out -4s infinite;
  }
  html[data-motion="on"] .petalart {
    transform-origin: 60% 85%;
    animation: bloom-sway 8s ease-in-out infinite alternate;
  }
  html[data-motion="on"] .petalart i {
    animation: petal-drift 6s ease-in-out infinite alternate;
  }
  html[data-motion="on"] .petalart i:nth-child(2) {
    animation-delay: -3s;
